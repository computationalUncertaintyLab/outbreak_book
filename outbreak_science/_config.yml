# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: Outbreak Science and Public Health Forecasting
author: Tom McAndrew
copyright: "2026"
logo: logo.png

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force

# Define the name of the latex output file for PDF builds
latex:
  latex_documents:
    targetname: book.tex

# Add a bibtex file so that we can create citations
bibtex_bibfiles:
  - references.bib

# Information about where the book exists on the web
repository:
  url: https://github.com/computationalUncertaintyLab/outbreak_book
  path_to_book: outbreak_science
  branch: main

# Run notebook code in the browser (ipywidgets sliders, live plots, etc.)
launch_buttons:
  binderhub_url: "https://mybinder.org"
  thebe: true
  notebook_interface: classic

# HTML output and branding
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  favicon: logo.png
  home_page_in_navbar: true
  navbar_footer_text: Computational Uncertainty Lab
  use_edit_page_button: true
  use_issues_button: true
  use_repository_button: true
  extra_footer: |
    <p>Computational Uncertainty Lab · Outbreak Science</p>

# Ensure widgets render in static HTML (e.g., ipywidgets)
sphinx:
  config:
    html_js_files:
      - https://cdnjs.cloudflare.com/ajax/libs/require.js/2.3.4/require.min.js
    html_css_files:
      - custom.css
    thebe_config:
      repository_url: https://github.com/computationalUncertaintyLab/outbreak_book
      repository_branch: main
      path_to_docs: outbreak_science
    html_theme_options:
      logo:
        text: Outbreak Science
      repository_url: https://github.com/computationalUncertaintyLab/outbreak_book
      repository_branch: main
      path_to_docs: outbreak_science
      use_repository_button: true
      use_edit_page_button: true
      use_issues_button: true
      launch_buttons:
        binderhub_url: "https://mybinder.org"
        thebe: true
        notebook_interface: classic
      primary_sidebar_end:
        - page-toc
        - edit-this-page
      navbar_align: content
      show_navbar_depth: 1
      collapse_navigation: false
      show_toc_level: 2
      use_download_button: true
      use_fullscreen_button: true
      icon_links: []


# Latex styles
parse:
  myst_enable_extensions:
    # don't forget to list any other extensions you want enabled,
    # including those that are enabled by default!
    - amsmath
    - dollarmath
